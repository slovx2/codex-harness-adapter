name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.26.6
      - name: Linux 沙箱依赖
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - name: 安装隔离的测试 CLI
        run: |
          npm install --prefix .artifacts/host-cli --save-exact @anthropic-ai/claude-code@2.1.282 --no-audit --no-fund
          echo "CHA_CLAUDE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-cli/node_modules/.bin/claude" >> "${GITHUB_ENV}"
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:local-ssh
      - run: npm run docs:build

  # dsh 本体不随适配器分发，测试需要一份真实的 dsh：按 protocol/versions.json 登记的下限版本装到临时前缀。
  # 模型端是回环 mock，SSH 实例整体运行在只允许回环外连的沙箱里（macOS 的 sandbox-exec）。
  dsh:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.26.6
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - name: 安装隔离的 dsh
        run: |
          version="$(node -p "require('./protocol/versions.json').dshMinimum")"
          npm install --prefix .artifacts/host-dsh --save-exact "@deepseek-ai/dsh@${version}" --no-audit --no-fund
          echo "CHA_DSH_CLI=${GITHUB_WORKSPACE}/.artifacts/host-dsh/node_modules/.bin/dsh" >> "${GITHUB_ENV}"
      - run: npm run test:dsh
      - run: npm run test:dsh-ssh

  protocol-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo test --workspace --locked
